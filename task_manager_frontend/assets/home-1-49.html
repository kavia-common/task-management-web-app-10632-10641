<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>home - 1-49</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load token fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Lobster&family=Poppins:wght@500&family=Roboto:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./common.css" />
  <link rel="stylesheet" href="./home-1-49.css" />
  <style>
    /* Optional body centering for preview */
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #eee; }
  </style>
</head>
<body>
  <main id="home-1-49" class="screen round-35" role="main" aria-label="Home screen">

    <!-- Foodgo header -->
    <h1 id="el-1-50" class="abs typo-5">Foodgo</h1>
    <p id="el-1-51" class="abs typo-6">Order your favourite food!</p>

    <!-- Avatar Mask group -->
    <div id="grp-1-52" class="abs" aria-hidden="true">
      <div id="rect-1-53" class="abs"></div>
      <img id="img-1-54" class="abs" alt="" src="../assets/figmaimages/figma_image_1_54.png" />
    </div>

    <!-- Search and filter -->
    <div id="grp-1-55" class="abs" role="search">
      <div id="rect-1-56" class="abs shadow-0" aria-hidden="true"></div>

      <div id="grp-1-57" class="abs">
        <button id="rect-1-58" class="abs button-reset round-20 shadow-1" data-action="open-filters" aria-label="Open filters"></button>
        <div id="icon-1-59" class="abs" aria-hidden="true">
          <!-- settings sliders icon is represented by the colored block of the button; vector paths not provided -->
        </div>
      </div>

      <div id="grp-1-60" class="abs">
        <div id="icon-1-61" class="abs">
          <!-- search icon path fill in dark; vector not provided, placeholder box -->
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="#3c2f2f" stroke-width="2" fill="none"></circle>
            <line x1="16" y1="16" x2="22" y2="22" stroke="#3c2f2f" stroke-width="2"></line>
          </svg>
        </div>
        <span id="txt-1-62" class="abs typo-7">Search</span>
      </div>
    </div>

    <!-- Categories -->
    <div id="frm-1-63" class="abs" aria-label="Categories">
      <div id="frm-1-64" class="abs">
        <div id="grp-1-65" class="abs">
          <button id="rect-1-66" class="abs button-reset round-20 shadow-1" data-role="category-tab" data-category="all" aria-pressed="true"></button>
          <span id="txt-1-67" class="abs typo-8">All</span>
        </div>
        <div id="grp-1-68" class="abs">
          <button id="rect-1-69" class="abs button-reset round-20" data-role="category-tab" data-category="combos"></button>
          <span id="txt-1-70" class="abs typo-9">Combos</span>
        </div>
        <div id="grp-1-71" class="abs">
          <button id="rect-1-72" class="abs button-reset round-20" data-role="category-tab" data-category="sliders"></button>
          <span id="txt-1-73" class="abs typo-9">Sliders</span>
        </div>
        <div id="grp-1-74" class="abs">
          <button id="rect-1-75" class="abs button-reset round-20" data-role="category-tab" data-category="classic"></button>
          <span id="txt-1-76" class="abs typo-9">Classic</span>
        </div>
      </div>
    </div>

    <!-- Cards Grid -->
    <section id="grp-1-77" class="abs" aria-label="Menu items">

      <!-- Card 1 -->
      <article id="grp-1-78" class="abs" aria-label="Cheeseburger Wendy's Burger">
        <div id="rect-1-79" class="abs round-20 shadow-2"></div>
        <div id="icon-1-80" class="abs" aria-hidden="true"></div>
        <h2 id="txt-1-81" class="abs typo-10">Cheeseburger Wendy's Burger</h2>
        <div id="ellipse-1-82" class="abs" aria-hidden="true"></div>
        <img id="img-1-83" class="abs" alt="Cheeseburger image" src="../assets/figmaimages/figma_image_1_83.png" />
        <div id="grp-1-84" class="abs">
          <div id="icon-1-85" class="abs" aria-hidden="true"></div>
          <span id="txt-1-86" class="abs typo-11">4.9</span>
        </div>
      </article>

      <!-- Card 2 -->
      <article id="grp-1-87" class="abs" aria-label="Hamburger Veggie Burger">
        <div id="rect-1-88" class="abs round-20 shadow-2"></div>
        <div id="icon-1-89" class="abs" aria-hidden="true"></div>
        <h2 id="txt-1-90" class="abs typo-10">Hamburger
Veggie Burger</h2>
        <div id="ellipse-1-91" class="abs" aria-hidden="true"></div>
        <img id="img-1-92" class="abs" alt="Veggie burger image" src="../assets/figmaimages/figma_image_1_92.png" />
        <div id="grp-1-93" class="abs">
          <div id="icon-1-94" class="abs" aria-hidden="true"></div>
          <span id="txt-1-95" class="abs typo-11">4.8</span>
        </div>
      </article>

      <!-- Card 3 -->
      <article id="grp-1-96" class="abs" aria-label="Hamburger Chicken Burger">
        <div id="rect-1-97" class="abs round-20 shadow-2"></div>
        <div id="icon-1-98" class="abs" aria-hidden="true"></div>
        <h2 id="txt-1-99" class="abs typo-10">Hamburger
Chicken Burger</h2>
        <div id="icon-1-100" class="abs" aria-hidden="true"></div>
        <img id="img-1-101" class="abs" alt="Chicken burger image" src="../assets/figmaimages/figma_image_1_101.png" />
        <div id="grp-1-102" class="abs">
          <div id="icon-1-103" class="abs" aria-hidden="true"></div>
          <span id="txt-1-104" class="abs typo-11">4.6</span>
        </div>
      </article>

      <!-- Card 4 -->
      <article id="grp-1-105" class="abs" aria-label="Hamburger Fried Chicken Burger">
        <div id="rect-1-106" class="abs round-20 shadow-2"></div>
        <div id="icon-1-107" class="abs" aria-hidden="true"></div>
        <h2 id="txt-1-108" class="abs typo-10">Hamburger
Fried Chicken Burger</h2>
        <div id="icon-1-109" class="abs" aria-hidden="true"></div>
        <img id="img-1-110" class="abs" alt="Fried chicken burger image" src="../assets/figmaimages/figma_image_1_110.png" />
        <div id="grp-1-111" class="abs">
          <div id="icon-1-112" class="abs" aria-hidden="true"></div>
          <span id="txt-1-113" class="abs typo-11">4.5</span>
        </div>
        <div id="icon-1-114" class="abs" aria-hidden="true"></div>
      </article>
    </section>

    <!-- Bottom bar, pill background and icons -->
    <div id="grp-1-115" class="abs" aria-hidden="true">
      <div id="bool-1-116" class="abs"></div>
      <div id="ellipse-1-118" class="abs"></div>
      <div id="grp-1-119" class="abs">
        <div id="ellipse-1-120" class="abs"></div>
        <div id="ellipse-1-121" class="abs"></div>
      </div>
    </div>

    <!-- Bottom nav icons (placeholders) -->
    <div id="icon-1-122" class="abs" aria-hidden="true"></div>
    <div id="icon-1-123" class="abs" aria-hidden="true"></div>
    <div id="icon-1-124" class="abs" aria-hidden="true"></div>
    <div id="icon-1-125" class="abs" aria-hidden="true"></div>

    <!-- Small white dot -->
    <div id="ellipse-1-126" class="abs" aria-hidden="true"></div>

    <!-- Floating action button -->
    <button id="grp-1-127" class="abs button-reset" data-action="add" aria-label="Add new">
      <div id="ellipse-1-128" class="abs"></div>
      <div id="grp-1-129" class="abs" aria-hidden="true">
        <div id="line-1-130"></div>
        <div id="line-1-131"></div>
      </div>
    </button>

  </main>

  <script src="./app.js"></script>
</body>
</html>
